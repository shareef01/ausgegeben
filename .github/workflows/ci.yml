name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: chmod +x gradlew

      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Audit runtime deps only — firebase-tools / vite-plugin-pwa pull
      # known-high transitive advisories that don't ship in the browser bundle.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

  # Legacy commit-status API stays "pending" with zero statuses when only
  # check-runs exist — some clients (incl. Cursor) treat that as failing CI.
  status:
    needs: [android, web]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Report combined commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          if [ "${{ needs.android.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
            state=failure
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI" \
            -f description="android=${{ needs.android.result }}; web=${{ needs.web.result }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
