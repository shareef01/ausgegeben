name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, dependency-free checks over the workflow files themselves — catches a
  # regression like CI-3 (an unescaped GitHub Actions expression reaching a shell
  # command) without needing any of the heavier jobs below to even start.
  workflow_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: release.yml tag-validation regression test (CI-3)
        run: bash scripts/test-release-tag-validation.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Verifies the committed gradle-wrapper.jar's checksum against Gradle's own
      # published list before any of it executes (CI-2) — distributionSha256Sum in
      # gradle-wrapper.properties only checks the downloaded Gradle *distribution*; it
      # has no way to verify the wrapper jar binary that is already committed to git.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # No `with.packages` override before this fix defaulted to "tools platform-tools"
      # (see this action's action.yml at the pinned SHA) — this job never calls adb
      # (no device/emulator, only testProdDebugUnitTest/lintProdDebug/assembleProdDebug
      # and the R8 release build below) and the legacy "tools" package no longer exists
      # in Google's SDK repository, so requesting it made sdkmanager exit 1 before any
      # Gradle step ran. compileSdk's platform and build-tools are downloaded on demand
      # by AGP itself during the Gradle build (as they already were even under the old
      # default, which never included them) — nothing needs to be pre-installed here.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - run: chmod +x gradlew

      # Forks cannot receive repository secrets. The checked-in CI-only config names
      # a deliberately nonexistent Firebase project, but is structurally valid so R8
      # and startup tests execute on every PR without granting backend access.
      - name: Restore google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cp app/google-services.ci.json app/google-services.json
            echo "Using isolated CI-only Firebase config (no backend access)."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi

      # lintDebug catches manifest/config errors (e.g. a stray WorkManager
      # initializer silently dropping the Hilt worker factory) that compile fine
      # but break at runtime — and that would otherwise only surface in release.
      - run: ./gradlew testProdDebugUnitTest lintProdDebug assembleProdDebug --no-daemon

      # minifyEnabled/shrinkResources only apply to the release build type, so a
      # debug-only CI never executes R8 — ProGuard breakage would first appear in
      # a build handed to users. Unsigned output is fine; running R8 is the point.
      - name: Build release (runs R8)
        run: ./gradlew assembleProdRelease --no-daemon

  # ExportFileProviderTest guards a security boundary — that file_paths.xml exposes
  # the exports subdir and nothing above it — and MainActivityLaunchTest catches a
  # broken Hilt graph, which compiles cleanly and only fails at runtime. Both
  # existed unrun until now, so neither could have caught a regression.
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # The runner exposes /dev/kvm but not to the runner user, and without
      # acceleration the emulator is too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # MainActivity only needs a structurally valid config to launch. Forks use the
      # isolated nonexistent project; same-repository runs may use the real config.
      - name: Restore google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cp app/google-services.ci.json app/google-services.json
            echo "Using isolated CI-only Firebase config (no backend access)."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi

      - run: chmod +x gradlew

      # api-level 29 is the project's minSdk — the configuration least likely to be
      # covered by whatever device development happens on.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedProdDebugAndroidTest --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Build tools execute with repository access in CI, so they are part of the
      # supply-chain boundary even though they do not ship in the browser bundle.
      - run: npm audit --audit-level=high
        working-directory: web

      - run: npm test
        working-directory: web

      # This project hand-writes its utility classes (no Tailwind build), so an
      # undefined one is silently inert — it has already shipped an invisible
      # loading skeleton and an off-screen bottom nav.
      - run: npm run lint:css
        working-directory: web

      # TEL-1: fails if a repository/service throw site dumps a whole object's
      # contents into an Error message, which no telemetry redaction regex can
      # distinguish from safe free text.
      - run: npm run lint:telemetry
        working-directory: web

      - run: npm run build
        working-directory: web

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/error-endpoint/package-lock.json
      - run: npm ci
        working-directory: tools/error-endpoint
      - run: npm audit --audit-level=high
        working-directory: tools/error-endpoint
      - run: npm test
        working-directory: tools/error-endpoint

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # firebase-tools Firestore emulator requires JDK 21+
          java-version: 21

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run test:rules
        working-directory: web

      # Repository logic (dedupe, category delete, orphan repair, batch chunking)
      # only does anything against a real Firestore. Shares this job because the
      # emulator and JDK 21 are already set up here.
      - run: npm run test:emulator
        working-directory: web

  # Real-browser regression coverage for auth/session lifecycle guarantees no unit test
  # can actually verify (mocking the Firebase SDK and browser storage tests the mock,
  # not the browser) — see AUTH-1, AUTH-2, TEST-1. `.env.emulator` is gitignored (it is
  # local dev convenience, not a secret — every value in it is a fake/demo placeholder)
  # so it is regenerated here rather than committed.
  browser_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # firebase-tools Firestore emulator requires JDK 21+
          java-version: 21

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Write emulator-only Firebase config
        run: |
          cat > web/.env.emulator <<'EOF'
          VITE_FIREBASE_API_KEY=fake-api-key
          VITE_FIREBASE_AUTH_DOMAIN=localhost
          VITE_FIREBASE_PROJECT_ID=demo-ausgegeben
          VITE_FIREBASE_APP_ID=1:0:web:0
          VITE_FIREBASE_USE_EMULATORS=true
          EOF

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npm run test:e2e
        working-directory: web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Legacy commit-status API stays "pending" with zero statuses when only
  # check-runs exist, so publish a combined status for compatible clients.
  status:
    needs: [android, instrumentation, web, rules, telemetry, browser_security, workflow_validation]
    if: |
      always() && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Report combined commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          for result in "${{ needs.android.result }}" "${{ needs.instrumentation.result }}" "${{ needs.web.result }}" "${{ needs.rules.result }}" "${{ needs.telemetry.result }}" "${{ needs.browser_security.result }}" "${{ needs.workflow_validation.result }}"; do
            if [ "$result" != "success" ]; then
              state=failure
              break
            fi
          done

          # The legacy commit-status API caps "description" at 140 characters — a
          # hard GitHub API limit, not a style choice. A per-job breakdown here
          # fit when this job tracked five dependencies and broke the instant a
          # sixth and seventh (browser_security, workflow_validation) were added.
          # Keep this a short, fixed literal whose length can never depend on how
          # many jobs `needs:` above lists, so adding another job here can never
          # silently break this API call again. The real per-job breakdown is not
          # lost: it's in this step's own summary below, and GitHub's native
          # check-runs — what branch protection and the PR UI actually read —
          # already show every job's true result independently of this legacy call.
          if [ "$state" = success ]; then
            description="CI: all required jobs passed"
          else
            description="CI: one or more required jobs failed"
          fi

          {
            echo "### Combined CI status: $state"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| android | ${{ needs.android.result }} |"
            echo "| instrumentation | ${{ needs.instrumentation.result }} |"
            echo "| web | ${{ needs.web.result }} |"
            echo "| rules | ${{ needs.rules.result }} |"
            echo "| telemetry | ${{ needs.telemetry.result }} |"
            echo "| browser_security | ${{ needs.browser_security.result }} |"
            echo "| workflow_validation | ${{ needs.workflow_validation.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
