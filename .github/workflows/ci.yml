name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - run: chmod +x gradlew

      # Release tasks refuse to build against the placeholder google-services.json
      # (see app/build.gradle.kts). Decode the real one from a secret so R8 can run
      # below; without the secret the release step is skipped rather than failing,
      # which keeps fork PRs green.
      - name: Restore google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — skipping the release build, so R8 is not exercised."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # lintDebug catches manifest/config errors (e.g. a stray WorkManager
      # initializer silently dropping the Hilt worker factory) that compile fine
      # but break at runtime — and that would otherwise only surface in release.
      - run: ./gradlew testProdDebugUnitTest lintProdDebug assembleProdDebug --no-daemon

      # minifyEnabled/shrinkResources only apply to the release build type, so a
      # debug-only CI never executes R8 — ProGuard breakage would first appear in
      # a build handed to users. Unsigned output is fine; running R8 is the point.
      - name: Build release (runs R8)
        if: steps.firebase_config.outputs.available == 'true'
        run: ./gradlew assembleProdRelease --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Audit runtime deps only — firebase-tools / vite-plugin-pwa pull
      # known-high transitive advisories that don't ship in the browser bundle.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - run: npm test
        working-directory: web

      # This project hand-writes its utility classes (no Tailwind build), so an
      # undefined one is silently inert — it has already shipped an invisible
      # loading skeleton and an off-screen bottom nav.
      - run: npm run lint:css
        working-directory: web

      - run: npm run build
        working-directory: web

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # firebase-tools Firestore emulator requires JDK 21+
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run test:rules
        working-directory: web

      # Repository logic (dedupe, category delete, orphan repair, batch chunking)
      # only does anything against a real Firestore. Shares this job because the
      # emulator and JDK 21 are already set up here.
      - run: npm run test:emulator
        working-directory: web

  # Legacy commit-status API stays "pending" with zero statuses when only
  # check-runs exist — some clients (incl. Cursor) treat that as failing CI.
  status:
    needs: [android, web, rules]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Report combined commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          if [ "${{ needs.android.result }}" != "success" ] || \
             [ "${{ needs.web.result }}" != "success" ] || \
             [ "${{ needs.rules.result }}" != "success" ]; then
            state=failure
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI" \
            -f description="android=${{ needs.android.result }}; web=${{ needs.web.result }}; rules=${{ needs.rules.result }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
