name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - run: chmod +x gradlew

      # Release tasks refuse to build against the placeholder google-services.json
      # (see app/build.gradle.kts). Decode the real one from a secret so R8 can run
      # below; without the secret the release step is skipped rather than failing,
      # which keeps fork PRs green.
      - name: Restore google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            # Forks cannot see secrets, and failing their PRs would be noise. On a
            # same-repo run the secret is supposed to be there, so its absence is a real
            # problem: skipping leaves the job green while R8 never runs, and an R8-only
            # crash is the single worst bug this project has shipped.
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Fork PR — no secret, so the release build (R8) is skipped."
            else
              echo "::error::GOOGLE_SERVICES_JSON is not set. R8 would silently not run."
              exit 1
            fi
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # lintDebug catches manifest/config errors (e.g. a stray WorkManager
      # initializer silently dropping the Hilt worker factory) that compile fine
      # but break at runtime — and that would otherwise only surface in release.
      - run: ./gradlew testProdDebugUnitTest lintProdDebug assembleProdDebug --no-daemon

      # minifyEnabled/shrinkResources only apply to the release build type, so a
      # debug-only CI never executes R8 — ProGuard breakage would first appear in
      # a build handed to users. Unsigned output is fine; running R8 is the point.
      - name: Build release (runs R8)
        if: steps.firebase_config.outputs.available == 'true'
        run: ./gradlew assembleProdRelease --no-daemon

  # ExportFileProviderTest guards a security boundary — that file_paths.xml exposes
  # the exports subdir and nothing above it — and MainActivityLaunchTest catches a
  # broken Hilt graph, which compiles cleanly and only fails at runtime. Both
  # existed unrun until now, so neither could have caught a regression.
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # The runner exposes /dev/kvm but not to the runner user, and without
      # acceleration the emulator is too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # MainActivity initializes Firebase on launch, so give it the real config
      # rather than the placeholder. Skips without the secret, keeping fork PRs green.
      - name: Restore google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            # Same reasoning as the android job: green-with-a-warning hid the fact that
            # none of the three instrumentation classes ran, including the one guarding
            # the FileProvider export boundary.
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Fork PR — no secret, so instrumentation tests are skipped."
            else
              echo "::error::GOOGLE_SERVICES_JSON is not set. Instrumentation would silently not run."
              exit 1
            fi
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - run: chmod +x gradlew

      # api-level 29 is the project's minSdk — the configuration least likely to be
      # covered by whatever device development happens on.
      - name: Run instrumentation tests
        if: steps.firebase_config.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedProdDebugAndroidTest --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Audit runtime deps only — firebase-tools / vite-plugin-pwa pull
      # known-high transitive advisories that don't ship in the browser bundle.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - run: npm test
        working-directory: web

      # This project hand-writes its utility classes (no Tailwind build), so an
      # undefined one is silently inert — it has already shipped an invisible
      # loading skeleton and an off-screen bottom nav.
      - run: npm run lint:css
        working-directory: web

      - run: npm run build
        working-directory: web

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # firebase-tools Firestore emulator requires JDK 21+
          java-version: 21

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run test:rules
        working-directory: web

      # Repository logic (dedupe, category delete, orphan repair, batch chunking)
      # only does anything against a real Firestore. Shares this job because the
      # emulator and JDK 21 are already set up here.
      - run: npm run test:emulator
        working-directory: web

  # Legacy commit-status API stays "pending" with zero statuses when only
  # check-runs exist — some clients (incl. Cursor) treat that as failing CI.
  status:
    needs: [android, instrumentation, web, rules]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Report combined commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          if [ "${{ needs.android.result }}" != "success" ] || \
             [ "${{ needs.instrumentation.result }}" != "success" ] || \
             [ "${{ needs.web.result }}" != "success" ] || \
             [ "${{ needs.rules.result }}" != "success" ]; then
            state=failure
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="CI" \
            -f description="android=${{ needs.android.result }}; instrumentation=${{ needs.instrumentation.result }}; web=${{ needs.web.result }}; rules=${{ needs.rules.result }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
