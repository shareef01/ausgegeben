# TEMPORARY — delete this file once the backup is verified and stored.
#
# The release signing key exists only as repository secrets. GitHub secrets are
# write-only through the API, so the key cannot be read back with `gh`; if those
# secrets are lost the app can never be updated again, because a differently
# signed APK will not install over an installed one.
#
# This workflow is the one supported way to get a copy out: it reads the signing
# secrets, encrypts them with a passphrase that is itself a secret, and uploads
# only the ciphertext.
#
# THIS REPOSITORY IS PUBLIC, so the uploaded artifact is world-downloadable for
# as long as it exists. That is survivable only because it is AES256 ciphertext
# and the passphrase never enters this repo, the run log, or a dispatch input
# (dispatch inputs are shown in the Actions UI). Use a long, high-entropy
# passphrase, download promptly, then delete the artifact, this file, and the
# RECOVERY_PASSPHRASE secret.
name: Export signing material (TEMPORARY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # keytool below needs a JDK; do not rely on whatever the runner image ships.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Encrypt signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.AUSGEGEBEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUSGEGEBEN_STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.AUSGEGEBEN_KEYALIAS }}
          KEY_PASSWORD: ${{ secrets.AUSGEGEBEN_KEYPASSWORD }}
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          missing=""
          [ -z "${RECOVERY_PASSPHRASE:-}" ] && missing="$missing RECOVERY_PASSPHRASE"
          [ -z "${KEYSTORE_BASE64:-}" ] && missing="$missing AUSGEGEBEN_KEYSTORE_BASE64"
          [ -z "${STORE_PASSWORD:-}" ] && missing="$missing AUSGEGEBEN_STOREPASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing AUSGEGEBEN_KEYALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing AUSGEGEBEN_KEYPASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # Plaintext is assembled only inside $work, never in the workspace that
          # gets uploaded, and never echoed.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$work/release.jks"
          {
            printf 'AUSGEGEBEN_KEYSTORE_BASE64=%s\n' "$KEYSTORE_BASE64"
            printf 'AUSGEGEBEN_STOREPASSWORD=%s\n'   "$STORE_PASSWORD"
            printf 'AUSGEGEBEN_KEYALIAS=%s\n'        "$KEY_ALIAS"
            printf 'AUSGEGEBEN_KEYPASSWORD=%s\n'     "$KEY_PASSWORD"
          } > "$work/signing.env"

          # Prove the secrets really hold the release key before trusting the
          # backup. A certificate fingerprint is public — it is in every shipped
          # APK — so printing it leaks nothing. It must match the signer of the
          # published releases: SHA256 24:53:9F:14:...:77:EE
          echo "--- certificate in AUSGEGEBEN_KEYSTORE_BASE64 ---"
          printf '%s' "$STORE_PASSWORD" > "$work/storepass"
          keytool -list -v \
            -keystore "$work/release.jks" \
            -alias "$KEY_ALIAS" \
            -storepass:file "$work/storepass" \
            | grep -E "^Owner:|^Valid from:|SHA256:"

          # Passphrase goes in by file, so it never appears in the process table.
          printf '%s' "$RECOVERY_PASSPHRASE" > "$work/pass"
          tar -C "$work" -cf "$work/bundle.tar" signing.env release.jks
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-file "$work/pass" \
              --output signing-material.tar.gpg \
              "$work/bundle.tar"

          echo "--- ciphertext ---"
          ls -l signing-material.tar.gpg | awk '{print "bytes:", $5}'
          sha256sum signing-material.tar.gpg

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: signing-material-encrypted
          path: signing-material.tar.gpg
          retention-days: 1
          if-no-files-found: error
