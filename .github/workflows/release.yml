name: Release

# Ausgegeben is distributed as a signed APK attached to a GitHub Release, not
# through Google Play. Tag a commit `v1.2.3` and this builds and publishes it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

# Least privilege by default; only the publishing job gets write access.
permissions:
  contents: read

jobs:
  # A tag is not evidence. `git tag` on any commit used to publish an APK without
  # running a single test — CI runs on pushes to main and pull requests, so a tag
  # placed on a commit that never landed there, or on a red one, shipped anyway.
  # These three jobs mirror ci.yml's fast suites and must pass before the build.
  #
  # Deliberately excluded: connectedProdDebugAndroidTest. The release job already
  # boots an emulator for the launch check, and a second one would roughly double
  # wall time for coverage that ci.yml already provides on the way to main.
  gate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - run: chmod +x gradlew

      # No secrets needed: app/build.gradle.kts copies google-services.json.example
      # when the real file is absent, and debug tasks accept the placeholder.
      - run: ./gradlew testProdDebugUnitTest lintProdDebug --no-daemon

  gate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run lint:css
        working-directory: web

      - run: npm run build
        working-directory: web

  gate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # firebase-tools Firestore emulator requires JDK 21+
          java-version: 21

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The rules are the actual security boundary (App Check is unenforced by
      # design), so shipping a client without re-proving them is the wrong order.
      - run: npm run test:rules
        working-directory: web

      - run: npm run test:emulator
        working-directory: web

  release:
    needs: [gate-android, gate-web, gate-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history + tags: the publish step derives the release-notes range from
          # `git describe --tags HEAD^`, which on the default shallow clone always failed,
          # silently passing an empty --notes-start-tag and falling through to the
          # fallback command on every single release.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - run: chmod +x gradlew

      # Every secret has to be present: a release built without the real Firebase
      # config or signed with the wrong key is worse than no release at all, so
      # this fails loudly rather than publishing something broken.
      - name: Restore signing material
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.AUSGEGEBEN_KEYSTORE_BASE64 }}
          AUSGEGEBEN_STOREPASSWORD: ${{ secrets.AUSGEGEBEN_STOREPASSWORD }}
          AUSGEGEBEN_KEYALIAS: ${{ secrets.AUSGEGEBEN_KEYALIAS }}
          AUSGEGEBEN_KEYPASSWORD: ${{ secrets.AUSGEGEBEN_KEYPASSWORD }}
        run: |
          missing=""
          [ -z "$GOOGLE_SERVICES_JSON" ] && missing="$missing GOOGLE_SERVICES_JSON"
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing AUSGEGEBEN_KEYSTORE_BASE64"
          [ -z "$AUSGEGEBEN_STOREPASSWORD" ] && missing="$missing AUSGEGEBEN_STOREPASSWORD"
          [ -z "$AUSGEGEBEN_KEYALIAS" ] && missing="$missing AUSGEGEBEN_KEYALIAS"
          [ -z "$AUSGEGEBEN_KEYPASSWORD" ] && missing="$missing AUSGEGEBEN_KEYPASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks

      # Android will not install an APK whose versionCode is not greater than the
      # installed one. Derive a monotonic code from the semver tag so each release
      # can update the last: v1.2.3 -> 10203.
      - name: Derive version from tag
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$TAG_INPUT"
          NAME="${TAG#v}"
          if ! echo "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # 10# forces base 10: bash reads a leading-zero operand as octal, so
          # v1.010.5 would otherwise yield 10805 instead of 11005.
          MAJOR=$((10#$(echo "$NAME" | cut -d. -f1)))
          MINOR=$((10#$(echo "$NAME" | cut -d. -f2)))
          PATCH=$((10#$(echo "$NAME" | cut -d. -f3)))
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::MINOR and PATCH must each be <= 99 for the versionCode scheme"
            exit 1
          fi
          # versionCode is a signed 32-bit int; Play's own ceiling is 2100000000.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$CODE" -gt 2100000000 ]; then
            echo "::error::versionCode $CODE exceeds the 2100000000 ceiling"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          AUSGEGEBEN_STOREFILE: release.jks
          AUSGEGEBEN_STOREPASSWORD: ${{ secrets.AUSGEGEBEN_STOREPASSWORD }}
          AUSGEGEBEN_KEYALIAS: ${{ secrets.AUSGEGEBEN_KEYALIAS }}
          AUSGEGEBEN_KEYPASSWORD: ${{ secrets.AUSGEGEBEN_KEYPASSWORD }}
        run: |
          ./gradlew assembleProdRelease --no-daemon \
            -PausgegebenVersionName=${{ steps.version.outputs.name }} \
            -PausgegebenVersionCode=${{ steps.version.outputs.code }}

      # `apksigner verify` only proves the APK carries a valid signature — it says
      # nothing about *which* key produced it, and exits 0 for any self-signed cert.
      # A locally built APK signed with a throwaway `CN=Test` key verifies happily.
      # That matters because an APK signed with the wrong key cannot update an
      # existing install: users are stranded on the old version with no upgrade path
      # and no error message that explains why. So pin the fingerprint and compare.
      - name: Verify the APK is signed by the expected key
        run: |
          APK=app/build/outputs/apk/prod/release/app-prod-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee apksigner-out.txt

          EXPECTED=$(grep -v '^[[:space:]]*#' .github/release-cert.sha256 \
            | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED" ] || ! echo "$EXPECTED" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::.github/release-cert.sha256 does not contain a SHA-256 fingerprint."
            echo "Get it from the currently published APK (this is the key users already trust):"
            echo "  apksigner verify --print-certs ausgegeben-<version>.apk | grep -i 'SHA-256'"
            echo "or from the keystore:"
            echo "  keytool -list -v -keystore <release.jks> -alias <alias> | grep -i 'SHA256:'"
            echo "Then commit the 64-hex-character value (colons and case are ignored)."
            exit 1
          fi

          ACTUAL=$(grep -iE 'Signer #1 certificate SHA-256 digest' apksigner-out.txt \
            | head -1 | awk '{print $NF}' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Could not read a SHA-256 digest from apksigner output"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing key mismatch — refusing to publish an APK that cannot update existing installs."
            echo "expected $EXPECTED"
            echo "actual   $ACTUAL"
            exit 1
          fi
          echo "signing certificate matches the pinned fingerprint ($ACTUAL)"
          mv "$APK" "ausgegeben-${{ steps.version.outputs.name }}.apk"

      # Signing is finished and verified, so the keystore has no further use in this
      # job. Shred it *now* rather than at the end: the emulator step below is a
      # third-party action, and leaving decrypted signing material on disk across it
      # is an exposure window with no upside. The `if: always()` sweep at the end
      # still covers the paths that fail before reaching here.
      - name: Shred signing material before third-party steps
        run: shred -u release.jks 2>/dev/null || rm -f release.jks

      # AGENTS.md: assembling the release proves nothing — R8 once stripped Room's
      # generated constructors and every release APK crashed on launch, through
      # green CI. Signature checks don't catch that; only launching does. Boot an
      # emulator, install the signed release, and fail if it dies before 12s.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pinned to the v2.38.0 commit rather than the mutable `v2` tag: this action
      # runs in the same job that handles release signing, and a moved tag would
      # execute new third-party code here without any change to this repository.
      - name: Launch the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          # reactivecircus/android-emulator-runner runs each line of `script` as its
          # own `sh -c` invocation, not as one script — a multi-line if/fi here splits
          # across invocations and fails with a syntax error before ever checking the
          # app. Every check must fit on one line.
          script: |
            adb install "ausgegeben-${{ steps.version.outputs.name }}.apk"
            adb shell am start -n com.aus.ausgegeben/.MainActivity
            sleep 12
            adb shell pidof com.aus.ausgegeben > /dev/null || { echo "::error::release APK crashed on launch"; adb logcat -d | grep -iE 'FATAL|AndroidRuntime' | tail -20; exit 1; }
            echo "release APK survived first launch (pid $(adb shell pidof com.aus.ausgegeben | tr -d '\r'))"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag || github.ref_name }}" \
            "ausgegeben-${{ steps.version.outputs.name }}.apk" \
            --title "Ausgegeben ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
            || gh release create "${{ github.event.inputs.tag || github.ref_name }}" \
                 "ausgegeben-${{ steps.version.outputs.name }}.apk" \
                 --title "Ausgegeben ${{ steps.version.outputs.name }}" \
                 --generate-notes

      # Covers the failure paths that never reach the early shred above.
      - name: Shred signing material
        if: always()
        run: shred -u release.jks 2>/dev/null || rm -f release.jks
